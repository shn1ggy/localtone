name: Build unsigned test packages
# Build unsigned release candidates on release-related changes; never publish or use signing secrets.
on:
  workflow_dispatch:
  push:
    branches: [main, 'test/**']
    paths:
      - 'package.json'
      - 'online-updates.cjs'
      - 'build/**'
      - '.github/workflows/build-preview.yml' 
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
          - os: macos-15
            target: mac
          - os: macos-15-intel
            target: mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/checkout@v7
        with:
          repository: FFmpeg/FFmpeg
          ref: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
          path: ffmpeg-source
          persist-credentials: false
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm
      - if: runner.os == 'macOS'
        run: brew install nasm
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc make nasm diffutils
          path-type: inherit
      - uses: actions/cache@v4
        id: decoder-cache
        with:
          path: ffmpeg-build
          key: ffmpeg-9.0.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/ffmpeg/build.sh') }}
      - run: npm ci
      - if: runner.os != 'Windows' && steps.decoder-cache.outputs.cache-hit != 'true'
        run: bash build/ffmpeg/build.sh
      - if: runner.os == 'Windows' && steps.decoder-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash build/ffmpeg/build.sh
      - if: steps.decoder-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ffmpeg-build
          key: ffmpeg-9.0.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/ffmpeg/build.sh') }}
      - if: runner.os != 'Windows'
        run: node build/ffmpeg/finalize.mjs
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: node build/ffmpeg/finalize.mjs
      - run: node build/ffmpeg/smoke.mjs
      - run: npm run release:${{ matrix.target }}
      - run: npm run release:verify-downloads -- dist/checksums.json
      - if: runner.os == 'macOS'
        run: node build/verify-mac-package.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-test-${{ matrix.target }}-${{ runner.arch }}
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.blockmap
            dist/*.exe
            dist/*.AppImage
            dist/checksums.json
            dist/SHA256SUMS.txt

  assemble:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@v8
        with:
          pattern: unsigned-test-*
          path: candidate-input
      - run: node build/assemble-downloads.mjs candidate-input release-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: verified-release-candidate
          retention-days: 14
          if-no-files-found: error
          path: release-candidate/*
