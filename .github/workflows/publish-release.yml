name: Publish verified early access
on:
  push:
    branches: [main]
    paths: ['build/release-plan.json']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-localtone
  cancel-in-progress: false
jobs:
  wait-for-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      commit: ${{ steps.verified.outputs.commit }}
      run: ${{ steps.verified.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - id: verified
        run: node build/publish-release.mjs --wait
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: wait-for-verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: verified-release-candidate
          run-id: ${{ needs.wait-for-verification.outputs.run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-candidate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.wait-for-verification.outputs.commit }}
          path: release-source
          persist-credentials: false
      - run: npm ci
        working-directory: release-source
      - run: npm run release:source
        working-directory: release-source
      - run: cp release-source/dist/*-source.zip release-candidate/
      - run: python build/verify-release-archives.py --self-test
      - run: python build/verify-release-archives.py release-candidate
      - run: node build/publish-release.mjs release-candidate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
