name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run verify
      - name: Native macOS UI and detached mini player
        timeout-minutes: 2
        if: runner.os == 'macOS'
        run: npm run verify:desktop-ui
      - name: Native Linux UI and detached mini player
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: ./node_modules/.bin/electron --no-sandbox --ozone-platform=headless --disable-dev-shm-usage build/check-desktop-ui.cjs
      - name: Native Windows UI and window transitions
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: npm run verify:desktop-ui
      - name: Native Windows UI at 125% display scaling
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: npm run verify:desktop-ui
        env:
          UI_CHECK_SCALE: '1.25'
      - name: Native Windows UI at 130% display scaling
        timeout-minutes: 2
        if: runner.os == 'Windows'
        run: npm run verify:desktop-ui
        env:
          UI_CHECK_SCALE: '1.3'
          UI_CHECK_GPU: '1'
      - name: Audio rendering and live gapless playback
        timeout-minutes: 2
        if: runner.os != 'Linux'
        run: npm run verify:playback
      - name: Audio rendering and live gapless playback (Linux)
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: ./node_modules/.bin/electron --no-sandbox --ozone-platform=headless --disable-dev-shm-usage build/check-playback.cjs
      - name: Floating playlist icon picker
        timeout-minutes: 2
        if: runner.os != 'Linux'
        run: npm run verify:playlist-icons
      - name: Floating playlist icon picker (Linux)
        timeout-minutes: 2
        if: runner.os == 'Linux'
        run: ./node_modules/.bin/electron --no-sandbox --ozone-platform=headless --disable-dev-shm-usage build/check-playlist-icons.cjs
      - run: npm run benchmark
      - name: Album and queue benchmark
        run: npm run benchmark
        env:
          BENCH_ALBUMS: '1'
          BENCH_QUEUE: '1'
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=moderate
